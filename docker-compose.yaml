version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: trustdesk-postgres
    restart: always
    environment:
      POSTGRES_DB: trustdesk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: poorna
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trustdesk"]
      interval: 5s
      timeout: 5s
      retries: 5

  trustdesk-app:
    image: your-dockerhub-username/trustdesk-ai:latest # REPLACE THIS with your actual image name
    container_name: trustdesk-ai-app
    restart: always
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/trustdesk
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=poorna
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
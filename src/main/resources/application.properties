spring.application.name=trustdeskAi
server.port=8083
#spring.mvc.servlet.path=/api/v1
# ===================================================================
# POSTGRESQL & JPA CONFIGURATION
# ===================================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:5432/trustdesk
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:poorna}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# SPRING AI - GOOGLE GENAI (GEMINI)
# ===================================================================
## Set your environment variable GEMINI_API_KEY or replace ${GEMINI_API_KEY} directly
#spring.ai.google.genai.api-key=${GEMINI_API_KEY}
#spring.ai.google.genai.chat.options.model=gemini-2.5-flash
#spring.ai.google.genai.chat.options.temperature=0.2

# Ollama Connection Settings
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://host.docker.internal:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:gemma4:31b-cloud}
spring.ai.ollama.chat.options.temperature=0.2

# ===================================================================
# SPRING AI - BAAI LOCAL EMBEDDING MODEL (ONNX TRANSFORMERS)
# ===================================================================
# Correct property keys (no .onnx in the tokenizer key):
spring.ai.embedding.transformer.onnx.model-uri=classpath:models/bge-small-en-v1.5.onnx
spring.ai.embedding.transformer.tokenizer.uri=classpath:models/tokenizer.json
# Disable online cache lookup fallback:
spring.ai.embedding.transformer.cache.enabled=false

# ===================================================================
# SPRING AI - PGVECTOR STORE
# ===================================================================
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
# Note: 384 dimensions matches bge-small-en-v1.5. Set to 1024 if using bge-large or bge-m3.
spring.ai.vectorstore.pgvector.dimensions=384

# ===================================================================
# FILE UPLOAD LIMITS (SPRING MULTIPART)
# ===================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# Enable detailed Spring AI logs (Chat Client, Functions, Vectors)
logging.file.name=logs/trustdesk-ai.log
logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.ai.chat.client=DEBUG
logging.level.org.springframework.ai.model.function=DEBUG

# Optional: Log raw web requests if needed
logging.level.org.springframework.web=INFO